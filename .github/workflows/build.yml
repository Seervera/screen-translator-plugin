name: Build AAR Plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract Zip File
        run: |
          unzip -o *.zip || true
          if [ -d "godot-plugin-project" ]; then
            cp -r godot-plugin-project/* .
          fi

      - name: Build AAR Package
        run: gradle assembleRelease --stacktrace

      - name: Upload Generated AAR
        uses: actions/upload-artifact@v4
        with:
          name: screentranslator-plugin-aar
          path: '**/build/outputs/aar/*.aar'
          
