name: Build AAR

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Zip File (if exists)
        run: |
          if [ -f *.zip ]; then
            unzip -o *.zip || true
            if [ -d "godot-plugin-project" ]; then
              cp -r godot-plugin-project/* .
            fi
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Generate Gradle Wrapper (if missing)
        run: gradle wrapper --gradle-version 8.7 || true

      - name: Build AAR
        run: gradle assembleRelease --stacktrace || ./gradlew :plugin:assembleRelease

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: screentranslator-plugin-aar
          path: '**/build/outputs/aar/*.aar'
